[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "redragon-battery-monitor"
dynamic = ["version"]
description = "Monitor de bateria do Redragon M719RGB-PRO para Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "jean-devbr" }]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6-Essentials>=6.5"]
dev = ["pytest>=7"]

[project.scripts]
redragon-battery = "redragon_monitor.cli:main"
redragon-battery-gui = "redragon_monitor.main:main"

[project.urls]
Homepage = "https://github.com/jean-devbr/redragon-battery-monitor"

[tool.setuptools.dynamic]
version = { attr = "redragon_monitor.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
